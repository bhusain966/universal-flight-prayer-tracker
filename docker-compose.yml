version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Universal Flight Prayer Tracker — Docker Compose
#
# Services:
#   db    — MySQL 8 database
#   app   — Node.js production server (built from Dockerfile)
#
# Quick start:
#   1. cp .env.example .env  and fill in your values
#   2. docker compose up --build
#   3. Open http://localhost:3000
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── MySQL 8 ────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: flight_tracker_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flighttracker}
      MYSQL_USER: ${MYSQL_USER:-flightuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flightpassword}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Run the initial schema migration on first boot
      - ./drizzle/0000_graceful_excalibur.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Application ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight_tracker_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000

      # Database — points to the db service above
      DATABASE_URL: mysql://${MYSQL_USER:-flightuser}:${MYSQL_PASSWORD:-flightpassword}@db:3306/${MYSQL_DATABASE:-flighttracker}

      # Auth / session
      JWT_SECRET: ${JWT_SECRET}
      VITE_APP_ID: ${VITE_APP_ID:-}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      OWNER_NAME: ${OWNER_NAME:-}

      # Flight data APIs (REQUIRED)
      AIRLABS_API_KEY: ${AIRLABS_API_KEY}
      FR24_API_KEY: ${FR24_API_KEY:-}

      # Manus built-in APIs (optional — only needed if using Manus platform features)
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      VITE_FRONTEND_FORGE_API_KEY: ${VITE_FRONTEND_FORGE_API_KEY:-}
      VITE_FRONTEND_FORGE_API_URL: ${VITE_FRONTEND_FORGE_API_URL:-}
      VITE_ANALYTICS_ENDPOINT: ${VITE_ANALYTICS_ENDPOINT:-}
      VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID:-}

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/trpc/auth.me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  db_data:
    driver: local
